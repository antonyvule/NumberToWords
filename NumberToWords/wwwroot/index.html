<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Number to Words Converter</title>

    <link href="bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-primary mb-5">Number to Words Converter</h1>

        <form id="converterForm" novalidate>
            <div class="mb-3">
                <label for="numberInput" class="form-label">Please enter a number to convert it to words:</label>
                <input id="numberInput" class="form-control" type="number"
                       step="0.01" min="0" max="999999999999.99" placeholder="0.00" autofocus />
            </div>

            <button id="convertButton" type="submit" class="btn btn-primary">Convert</button>
        </form>
        
        <div id="notificationMessage" class="alert d-none mt-3" role="alert"></div>
    </div>

    <script src="jquery-4.0.0.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
